<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Despeje de Ecuaciones — @clasesdenati</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: Arial, sans-serif;
      background: #f0f4ff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 2rem 1rem;
    }

    .tarjeta {
      background: white;
      border-radius: 16px;
      padding: 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      font-size: 20px;
      color: #333;
      margin-bottom: 0.3rem;
    }

    .subtitulo {
      text-align: center;
      font-size: 13px;
      color: #888;
      margin-bottom: 1.8rem;
    }

    /* ── FILA SUPERIOR ── */
    .score-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #888;
      margin-bottom: 1.2rem;
    }

    .score-row strong { color: #333; }

    /* Ticks de ecuaciones resueltas */
    .estrellas {
      font-size: 18px;
      letter-spacing: 2px;
      color: #2a9d5c;
      min-height: 22px;
    }

    /* ── ENUNCIADO ── */
    .etiqueta {
      font-size: 13px;
      color: #888;
      margin-bottom: 12px;
    }

    .ecuacion-display {
      font-size: 28px;
      text-align: center;
      color: #222;
      margin: 0 0 1.5rem;
      font-weight: 500;
    }

    /* ── CADA PASO ── */
    .paso-wrap {
      margin-bottom: 10px;
    }

    .paso {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 20px;
      color: #222;
    }

    .paso span { white-space: nowrap; }

    /* ── INPUT ── */
    .inp {
      width: 58px;
      font-size: 18px;
      text-align: center;
      padding: 5px 6px;
      border: 2px solid #ccc;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }

    .inp:disabled {
      opacity: 0.45;
      background: #f5f5f5;
    }

    .inp.ok {
      border-color: #2a9d5c;
      background: #eafaf1;
      color: #2a9d5c;
    }

    .inp.mal {
      border-color: #e03e3e;
      background: #fdf0f0;
      color: #e03e3e;
    }

    /* Quitar flechas del input number */
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
    input[type=number] { -moz-appearance: textfield; }

    /* ── ÍCONO ✓ ✗ ── */
    .icono { font-size: 16px; min-width: 16px; }
    .icono.ok  { color: #2a9d5c; }
    .icono.mal { color: #e03e3e; }

    /* ── PISTA debajo del paso ── */
    .pista-inline {
      font-size: 12px;
      color: #e08c00;
      margin-top: 3px;
      padding-left: 4px;
      display: none;
    }

    /* ── BOTÓN MENOS ── */
    .btn-menos {
      display: block;
      margin: 8px auto 0;
      width: 58px;
      height: 38px;
      font-size: 22px;
      font-weight: bold;
      color: #555;
      background: #f0f0f0;
      border: 1px solid #ccc;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-menos:hover {
      background: #e0e0e0;
    }

    .btn-menos:active {
      background: #d5d5d5;
    }
    
    /* ── MENSAJE FINAL ── */
    .bravo {
      text-align: center;
      font-size: 15px;
      font-weight: bold;
      color: #2a9d5c;
      margin-top: 14px;
      min-height: 20px;
    }

    /* ── BOTÓN SIGUIENTE ── */
    .btn-siguiente {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      background: #4a7eff;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 12px;
      display: none;
    }

    .btn-siguiente:hover { background: #2a5edd; }
  </style>
</head>
<body>

<div class="tarjeta">
  <h1>Despeje de Ecuaciones</h1>
  <p class="subtitulo">Grado 1 · @clasesdenati</p>

  <!-- FILA SUPERIOR: ejercicio + ticks resueltos -->
  <div class="score-row">
    <span>Ejercicio <strong id="num">1</strong></span>
    <div class="estrellas" id="estrellas"></div>
  </div>

  <!-- CONSIGNA -->
  <p class="etiqueta">Despejá x completando cada paso:</p>
  <div class="ecuacion-display" id="ecuacion">—</div>

  <!-- PASOS (se generan con JS) -->
  <div id="pasos"></div>

  <!-- BOTÓN MENOS -->
  <button
    type="button"
    class="btn-menos"
    id="btn-menos"
    onclick="ponerMenos()"
  >
    −
  </button>

  <!-- FINAL -->
  <div class="bravo" id="bravo"></div>
  <button class="btn-siguiente" id="btn-sig" onclick="nuevo()">Siguiente ejercicio</button>
</div>

<script>
  /* ── VARIABLES GLOBALES ── */
  let a, b, c;
  let pasoActual   = 0;
  let intentosPaso = 0;
  let okCnt        = 0;
  let numEj        = 1;

  /* ── NÚMERO ALEATORIO ── */
  function rand(min, max) {
    return Math.floor(Math.random() * (max - min + 1)) + min;
  }

  /* ── INPUT ACTUAL ── */
  let inputActivo = null;

  /* ── PONER / QUITAR SIGNO MENOS ── */
  function ponerMenos() {
  const inp = inputActivo;

  if (!inp || inp.disabled) return;

  let valor = inp.value;

  if (valor.startsWith('-')) {
    inp.value = valor.substring(1);
  } else {
    inp.value = '-' + valor;
  }

  inp.focus();
}

  /* ── GENERAR NUEVO EJERCICIO ── */
  function nuevo() {
    // Genera a, b, c con solución entera y a ≠ 0
    do {
      a = rand(-5, 5);
      b = rand(-10, 10);
      c = rand(-10, 10);
    } while (a === 0 || (c - b) % a !== 0);

    pasoActual   = 0;
    intentosPaso = 0;
    inputActivo  = null;

    document.getElementById('num').textContent       = numEj++;
    document.getElementById('bravo').textContent     = '';
    document.getElementById('btn-sig').style.display = 'none';

    const aMostrar = a ===  1 ? '' : a === -1 ? '−' : `${a}`;
    const bMostrar = b >= 0 ? `+ ${b}` : `− ${Math.abs(b)}`;
    const cMostrar = c >= 0 ? `${c}`   : `−${Math.abs(c)}`;
    const rhs2     = c - b;
    const xVal     = rhs2 / a;

    document.getElementById('ecuacion').textContent =
      `${aMostrar}x ${bMostrar} = ${cMostrar}`;

    // Definición de los 4 pasos
    window._pasos = [
      {
        izq: `${aMostrar}x`, mid: '=',
        der: `${c >= 0 ? c : '−' + Math.abs(c)} ${b >= 0 ? '−' : '+'} `,
        respuesta: Math.abs(b),
        pista1: `Pasás el ${b >= 0 ? '+' : ''}${b} al otro lado`,
        pista2: `Cambia de signo: queda ${c} ${b >= 0 ? '−' : '+'} ${Math.abs(b)}`
      },
      {
        izq: `${aMostrar}x`, mid: '=', der: '',
        respuesta: rhs2,
        pista1: `Resolvés ${c} ${b >= 0 ? '−' : '+'} ${Math.abs(b)}`,
        pista2: `${c} ${b >= 0 ? '−' : '+'} ${Math.abs(b)} = ${rhs2}`
      },
      {
        izq: 'x', mid: '=',
        der: `${rhs2} ÷ `,
        respuesta: a,
        pista1: `Dividís ambos lados por el coeficiente de x`,
        pista2: `El coeficiente de x es ${a}`
      },
      {
        izq: 'x', mid: '=', der: '',
        respuesta: xVal,
        pista1: `Calculás ${rhs2} ÷ ${a}`,
        pista2: `${rhs2} ÷ ${a} = ${xVal}`
      }
    ];

    // Construir los pasos en el DOM
    const cont = document.getElementById('pasos');
    cont.innerHTML = '';

    window._pasos.forEach(function(p, i) {
      const wrap = document.createElement('div');
      wrap.className = 'paso-wrap';

      const fila = document.createElement('div');
      fila.className = 'paso';

      const txt = document.createElement('span');
      txt.textContent = `${p.izq} ${p.mid} ${p.der}`;
      fila.appendChild(txt);

    const inp = document.createElement('input');

inp.type        = 'text';
inp.className   = 'inp';
inp.id          = 'inp-' + i;
inp.disabled    = (i !== 0);
inp.placeholder = '?';
inp.inputMode   = 'decimal';
inp.enterKeyHint = i < window._pasos.length - 1 ? 'next' : 'done';
inp.autocomplete = 'off';

/* Detectar qué input está activo */
inp.addEventListener('focus', function() {
  inputActivo = inp;
});

inp.addEventListener('click', function() {
  inputActivo = inp;
});

inp.addEventListener('input', function() {
  inputActivo = inp;
});

/* ── AVANZAR CON NEXT / DONE ── */
inp.addEventListener('keydown', function(evento) {

  /* Compatible con teclado físico y Safari/iPhone */
  if (evento.key !== 'Enter' && evento.keyCode !== 13) return;

  evento.preventDefault();
  evento.stopPropagation();

  if (i !== pasoActual) return;

  const valor = inp.value.trim();

  /* No validar si está vacío o quedó solamente el menos */
  if (valor === '' || valor === '-') return;

  /* Validar el paso */
  alEscribir(i);

  /* Si fue correcto, pasar al siguiente */
  if (pasoActual < window._pasos.length) {

    setTimeout(function() {

      const siguiente =
        document.getElementById('inp-' + pasoActual);

      if (siguiente && !siguiente.disabled) {
        siguiente.focus();
        inputActivo = siguiente;
      }

    }, 100);
  }
});
      fila.appendChild(inp);

      const ico = document.createElement('span');
      ico.className = 'icono';
      ico.id = 'ico-' + i;
      fila.appendChild(ico);

      const pista = document.createElement('div');
      pista.className = 'pista-inline';
      pista.id = 'pista-' + i;

      wrap.appendChild(fila);
      wrap.appendChild(pista);
      cont.appendChild(wrap);
    });

    const primero = document.getElementById('inp-0');
    primero.focus();
    inputActivo = primero;
  }

  /* ── VALIDACIÓN AUTOMÁTICA AL ESCRIBIR ── */
  function alEscribir(i) {
    if (i !== pasoActual) return;

    const inp     = document.getElementById('inp-' + i);
    const ico     = document.getElementById('ico-' + i);
    const pistaEl = document.getElementById('pista-' + i);
    const val     = inp.value.trim();

    inputActivo = inp;

    // Campo vacío: limpiar estado
    if (val === '') {
      inp.classList.remove('ok', 'mal');
      ico.textContent       = '';
      pistaEl.style.display = 'none';
      return;
    }

    const num      = parseFloat(val);
    const correcto = window._pasos[i].respuesta;

    if (num === correcto) {
      /* ── CORRECTO ── */
      inp.classList.remove('mal');
      inp.classList.add('ok');
      inp.disabled    = true;
      ico.textContent = '✓';
      ico.className   = 'icono ok';
      pistaEl.style.display = 'none';
      pistaEl.textContent   = '';
      intentosPaso = 0;
      pasoActual++;

      if (pasoActual < window._pasos.length) {
        // Habilitar el siguiente paso
        const next = document.getElementById('inp-' + pasoActual);
        next.disabled = false;

        setTimeout(function() {
          next.focus();
          inputActivo = next;
        }, 50);

      } else {
        // Ecuación completa — sumar tick arriba
        okCnt++;
        document.getElementById('estrellas').textContent = '✓'.repeat(okCnt);
        document.getElementById('bravo').textContent = okCnt === 1
          ? '¡Muy bien! Primera ecuación resuelta.'
          : `¡Excelente! ${okCnt} ecuaciones resueltas.`;
        document.getElementById('btn-sig').style.display = 'block';
      }

    } else {
      /* ── INCORRECTO — solo pista, sin contar error ── */
      inp.classList.remove('ok');
      inp.classList.add('mal');
      ico.textContent = '✗';
      ico.className   = 'icono mal';
      intentosPaso++;

      const p = window._pasos[i];
      pistaEl.textContent   = '💡 ' + (intentosPaso >= 2 ? p.pista2 : p.pista1);
      pistaEl.style.display = 'block';
    }
  }

  /* ── ARRANCAR ── */
  nuevo();
</script>

</body>
</html>
