<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Despeje de Ecuaciones — @clasesdenati</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f0f4ff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 2rem 1rem;
    }

    .tarjeta {
      background: white;
      border-radius: 16px;
      padding: 2rem;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.1);
    }

    h1 {
      text-align: center;
      font-size: 20px;
      color: #333;
      margin-bottom: 0.3rem;
    }

    .subtitulo {
      text-align: center;
      font-size: 13px;
      color: #888;
      margin-bottom: 1.8rem;
    }

    /* ── FILA SUPERIOR ── */

    .score-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 13px;
      color: #888;
      margin-bottom: 1.2rem;
    }

    .score-row strong {
      color: #333;
    }

    .estrellas {
      font-size: 18px;
      letter-spacing: 2px;
      color: #2a9d5c;
      min-height: 22px;
    }

    /* ── ENUNCIADO ── */

    .etiqueta {
      font-size: 13px;
      color: #888;
      margin-bottom: 12px;
    }

    .ecuacion-display {
      font-size: 28px;
      text-align: center;
      color: #222;
      margin: 0 0 1.5rem;
      font-weight: 500;
    }

    /* ── CADA PASO ── */

    .paso-wrap {
      margin-bottom: 10px;
    }

    .paso {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 20px;
      color: #222;
    }

    .paso span {
      white-space: nowrap;
    }

    /* ── INPUT ── */

    .inp {
      width: 58px;
      font-size: 18px;
      text-align: center;
      padding: 5px 6px;
      border: 2px solid #ccc;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.15s, background 0.15s;
    }

    .inp:disabled {
      opacity: 0.45;
      background: #f5f5f5;
    }

    .inp.ok {
      border-color: #2a9d5c;
      background: #eafaf1;
      color: #2a9d5c;
    }

    .inp.mal {
      border-color: #e03e3e;
      background: #fdf0f0;
      color: #e03e3e;
    }

    /* ── ÍCONO ✓ ✗ ── */

    .icono {
      font-size: 16px;
      min-width: 16px;
    }

    .icono.ok {
      color: #2a9d5c;
    }

    .icono.mal {
      color: #e03e3e;
    }

    /* ── PISTA ── */

    .pista-inline {
      font-size: 12px;
      color: #e08c00;
      margin-top: 3px;
      padding-left: 4px;
      display: none;
    }

    /* ── BOTÓN MENOS ── */

    .btn-menos {
      display: block;
      margin: 8px auto 0;
      width: 58px;
      height: 38px;
      font-size: 22px;
      font-weight: bold;
      color: #555;
      background: #f0f0f0;
      border: 1px solid #ccc;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-menos:hover {
      background: #e0e0e0;
    }

    .btn-menos:active {
      background: #d5d5d5;
    }

    /* ── BOTÓN SIGUIENTE DEL INPUT ── */

    .btn-avanzar {
      display: block;
      margin: 10px auto 0;
      width: 130px;
      height: 38px;
      font-size: 14px;
      font-weight: bold;
      color: white;
      background: #4a7eff;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }

    .btn-avanzar:hover {
      background: #2a5edd;
    }

    .btn-avanzar:active {
      background: #244fc2;
    }

    /* ── MENSAJE FINAL ── */

    .bravo {
      text-align: center;
      font-size: 15px;
      font-weight: bold;
      color: #2a9d5c;
      margin-top: 14px;
      min-height: 20px;
    }

    /* ── BOTÓN SIGUIENTE EJERCICIO ── */

    .btn-siguiente {
      width: 100%;
      padding: 12px;
      font-size: 15px;
      background: #4a7eff;
      color: white;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      margin-top: 12px;
      display: none;
    }

    .btn-siguiente:hover {
      background: #2a5edd;
    }
  </style>
</head>

<body>

<div class="tarjeta">

  <h1>Despeje de Ecuaciones</h1>

  <p class="subtitulo">
    Grado 1 · @clasesdenati
  </p>

  <!-- FILA SUPERIOR -->

  <div class="score-row">

    <span>
      Ejercicio <strong id="num">1</strong>
    </span>

    <div class="estrellas" id="estrellas"></div>

  </div>

  <!-- CONSIGNA -->

  <p class="etiqueta">
    Despejá x completando cada paso:
  </p>

  <div class="ecuacion-display" id="ecuacion">
    —
  </div>

  <!-- PASOS -->

  <div id="pasos"></div>

  <!-- BOTÓN MENOS -->

  <button
    type="button"
    class="btn-menos"
    id="btn-menos"
    onclick="ponerMenos()"
  >
    −
  </button>

  <!-- BOTÓN PARA AVANZAR -->

  <button
    type="button"
    class="btn-avanzar"
    id="btn-avanzar"
    onclick="avanzarManual()"
  >
    Siguiente →
  </button>

  <!-- FINAL -->

  <div class="bravo" id="bravo"></div>

  <button
    type="button"
    class="btn-siguiente"
    id="btn-sig"
    onclick="nuevo()"
  >
    Siguiente ejercicio
  </button>

</div>


<script>

  /* ─────────────────────────────
     VARIABLES GLOBALES
  ───────────────────────────── */

  let a, b, c;

  let pasoActual   = 0;
  let intentosPaso = 0;
  let okCnt        = 0;
  let numEj        = 1;

  let inputActivo = null;


  /* ─────────────────────────────
     NÚMERO ALEATORIO
  ───────────────────────────── */

  function rand(min, max) {

    return Math.floor(
      Math.random() * (max - min + 1)
    ) + min;

  }


  /* ─────────────────────────────
     PONER / QUITAR SIGNO MENOS
  ───────────────────────────── */

  function ponerMenos() {

    const inp = inputActivo;

    if (!inp || inp.disabled) return;

    let valor = inp.value;

    if (valor.startsWith('-')) {

      inp.value = valor.substring(1);

    } else {

      inp.value = '-' + valor;

    }

    inp.focus();

  }


  /* ─────────────────────────────
     AVANZAR CON EL BOTÓN
  ───────────────────────────── */

  function avanzarManual() {

    const inp = inputActivo;

    if (!inp || inp.disabled) return;

    const valor = inp.value.trim();

    /*
      No hacer nada si está vacío
      o solamente tiene el signo menos.
    */

    if (valor === '' || valor === '-') {

      inp.focus();

      return;

    }

    /*
      Validar el paso actual.
    */

    alEscribir(pasoActual);

  }


  /* ─────────────────────────────
     GENERAR NUEVO EJERCICIO
  ───────────────────────────── */

  function nuevo() {

    /*
      Genera a, b y c con solución entera
      y a distinto de cero.
    */

    do {

      a = rand(-5, 5);
      b = rand(-10, 10);
      c = rand(-10, 10);

    } while (
      a === 0 ||
      (c - b) % a !== 0
    );


    pasoActual   = 0;
    intentosPaso = 0;
    inputActivo  = null;


    /* Número de ejercicio */

    document.getElementById('num').textContent = numEj++;


    /* Limpiar mensajes */

    document.getElementById('bravo').textContent = '';


    /* Ocultar botón de nuevo ejercicio */

    document.getElementById('btn-sig').style.display = 'none';


    /* Mostrar botón para avanzar */

    document.getElementById('btn-avanzar').style.display = 'block';


    /* ─────────────────────────
       FORMATO DE LA ECUACIÓN
    ───────────────────────── */

    const aMostrar =
      a === 1
        ? ''
        : a === -1
          ? '−'
          : `${a}`;


    const bMostrar =
      b >= 0
        ? `+ ${b}`
        : `− ${Math.abs(b)}`;


    const cMostrar =
      c >= 0
        ? `${c}`
        : `−${Math.abs(c)}`;


    const rhs2 = c - b;

    const xVal = rhs2 / a;


    /* Mostrar ecuación */

    document.getElementById('ecuacion').textContent =
      `${aMostrar}x ${bMostrar} = ${cMostrar}`;


    /* ─────────────────────────
       DEFINICIÓN DE LOS 4 PASOS
    ───────────────────────── */

    window._pasos = [

      {
        izq: `${aMostrar}x`,
        mid: '=',
        der:
          `${c >= 0 ? c : '−' + Math.abs(c)} ` +
          `${b >= 0 ? '−' : '+'} `,

        respuesta: Math.abs(b),

        pista1:
          `Pasás el ${b >= 0 ? '+' : ''}${b} al otro lado`,

        pista2:
          `Cambia de signo: queda ${c} ` +
          `${b >= 0 ? '−' : '+'} ${Math.abs(b)}`
      },


      {
        izq: `${aMostrar}x`,
        mid: '=',
        der: '',

        respuesta: rhs2,

        pista1:
          `Resolvés ${c} ` +
          `${b >= 0 ? '−' : '+'} ${Math.abs(b)}`,

        pista2:
          `${c} ${b >= 0 ? '−' : '+'} ` +
          `${Math.abs(b)} = ${rhs2}`
      },


      {
        izq: 'x',
        mid: '=',
        der: `${rhs2} ÷ `,

        respuesta: a,

        pista1:
          `Dividís ambos lados por el coeficiente de x`,

        pista2:
          `El coeficiente de x es ${a}`
      },


      {
        izq: 'x',
        mid: '=',
        der: '',

        respuesta: xVal,

        pista1:
          `Calculás ${rhs2} ÷ ${a}`,

        pista2:
          `${rhs2} ÷ ${a} = ${xVal}`
      }

    ];


    /* ─────────────────────────
       CONSTRUIR LOS PASOS
    ───────────────────────── */

    const cont =
      document.getElementById('pasos');

    cont.innerHTML = '';


    window._pasos.forEach(function(p, i) {

      const wrap =
        document.createElement('div');

      wrap.className = 'paso-wrap';


      const fila =
        document.createElement('div');

      fila.className = 'paso';


      const txt =
        document.createElement('span');

      txt.textContent =
        `${p.izq} ${p.mid} ${p.der}`;


      fila.appendChild(txt);


      /* ─────────────────────
         INPUT
      ───────────────────── */

      const inp =
        document.createElement('input');


      /*
        TEXT + DECIMAL:

        Esto es más compatible con iPhone
        que type="number".

        Seguimos usando parseFloat()
        para validar los números.
      */

      inp.type = 'text';

      inp.className = 'inp';

      inp.id = 'inp-' + i;

      inp.disabled = (i !== 0);

      inp.placeholder = '?';

      inp.inputMode = 'decimal';

      inp.enterKeyHint =
        i < window._pasos.length - 1
          ? 'next'
          : 'done';

      inp.autocomplete = 'off';


      /* ─────────────────────
         INPUT ACTIVO
      ───────────────────── */

      inp.addEventListener(
        'focus',
        function() {

          inputActivo = inp;

        }
      );


      inp.addEventListener(
        'click',
        function() {

          inputActivo = inp;

        }
      );


      inp.addEventListener(
        'input',
        function() {

          inputActivo = inp;

        }
      );


      /* ─────────────────────
         ENTER EN PC / SAMSUNG
      ───────────────────── */

      inp.addEventListener(
        'keydown',
        function(evento) {

          if (
            evento.key !== 'Enter' &&
            evento.keyCode !== 13
          ) {
            return;
          }


          evento.preventDefault();


          if (i !== pasoActual) {
            return;
          }


          const valor =
            inp.value.trim();


          if (
            valor === '' ||
            valor === '-'
          ) {
            return;
          }


          /*
            Validamos.
            Si es correcta, alEscribir()
            habilita y enfoca el siguiente.
          */

          alEscribir(i);

        }
      );


      fila.appendChild(inp);


      /* ─────────────────────
         ICONO
      ───────────────────── */

      const ico =
        document.createElement('span');

      ico.className = 'icono';

      ico.id = 'ico-' + i;


      fila.appendChild(ico);


      /* ─────────────────────
         PISTA
      ───────────────────── */

      const pista =
        document.createElement('div');

      pista.className =
        'pista-inline';

      pista.id =
        'pista-' + i;


      wrap.appendChild(fila);

      wrap.appendChild(pista);

      cont.appendChild(wrap);

    });


    /* ─────────────────────
       ACTIVAR PRIMER INPUT
    ───────────────────── */

    const primero =
      document.getElementById('inp-0');


    primero.focus();

    inputActivo = primero;

  }


  /* ─────────────────────────────
     VALIDACIÓN
  ───────────────────────────── */

  function alEscribir(i) {

    if (i !== pasoActual) {
      return;
    }


    const inp =
      document.getElementById('inp-' + i);


    const ico =
      document.getElementById('ico-' + i);


    const pistaEl =
      document.getElementById('pista-' + i);


    const val =
      inp.value.trim();


    inputActivo = inp;


    /* Campo vacío */

    if (val === '') {

      inp.classList.remove(
        'ok',
        'mal'
      );

      ico.textContent = '';

      pistaEl.style.display = 'none';

      return;

    }


    /* Convertir a número */

    const num =
      parseFloat(val);


    const correcto =
      window._pasos[i].respuesta;


    /* ─────────────────────
       CORRECTO
    ───────────────────── */

    if (num === correcto) {

      inp.classList.remove('mal');

      inp.classList.add('ok');

      inp.disabled = true;


      ico.textContent = '✓';

      ico.className = 'icono ok';


      pistaEl.style.display = 'none';

      pistaEl.textContent = '';


      intentosPaso = 0;

      pasoActual++;


      /* ─────────────────
         SIGUIENTE PASO
      ───────────────── */

      if (
        pasoActual <
        window._pasos.length
      ) {

        const next =
          document.getElementById(
            'inp-' + pasoActual
          );


        next.disabled = false;


        setTimeout(
          function() {

            next.focus();

            inputActivo = next;

          },
          50
        );


      } else {

        /* ─────────────────
           ECUACIÓN COMPLETA
        ───────────────── */

        okCnt++;


        document.getElementById(
          'estrellas'
        ).textContent =
          '✓'.repeat(okCnt);


        document.getElementById(
          'bravo'
        ).textContent =
          okCnt === 1
            ? '¡Muy bien! Primera ecuación resuelta.'
            : `¡Excelente! ${okCnt} ecuaciones resueltas.`;


        /* Ocultar botón de avanzar */

        document.getElementById(
          'btn-avanzar'
        ).style.display = 'none';


        /* Mostrar siguiente ejercicio */

        document.getElementById(
          'btn-sig'
        ).style.display = 'block';

      }

    }

    /* ─────────────────────
       INCORRECTO
    ───────────────────── */

    else {

      inp.classList.remove('ok');

      inp.classList.add('mal');


      ico.textContent = '✗';

      ico.className = 'icono mal';


      intentosPaso++;


      const p =
        window._pasos[i];


      pistaEl.textContent =
        '💡 ' +
        (
          intentosPaso >= 2
            ? p.pista2
            : p.pista1
        );


      pistaEl.style.display =
        'block';

    }

  }


  /* ─────────────────────────────
     ARRANCAR
  ───────────────────────────── */

  nuevo();

</script>

</body>
</html>
